<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#10244;&#10246;&#10247; STARTPAGE &#10296;&#10288;&#10272;</title>
    <link rel="icon" href="./icon.ico" />
    <script src="https://kit.fontawesome.com/11cc7c6173.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body style="padding: 0px; margin: 0px;">
    <br /><br />

    <div id="greeting" class="imgText">Good <span id="tod"></span></div>
    <br />
    <div id="time" class="imgText"></div>
    <div id="date" class="imgText"></div>
    <br />
    <div id="weather-output" style="font-family: 'Courier New', Courier, monospace;" class="imgText">
      Loading location and weather data...
    </div>
    <br /><br />

    <div id="search-container">
      <form>
        <input type="search" id="searchInput" placeholder="Search..." autocomplete="off" autofocus />
      </form>
      <div id="results"></div>
    </div>

    <div id="cfe-settings-window">
      <div id="cfe-settings">
        <div id="cfe-settings-header">
          	<div>
              &nbsp;
            </div>
          	<div style="text-align: center; padding: none;">
              <h1>Settings</h1>
            </div>
          	<div style="text-align: right;">
              <button type="button" id="cfe-close-btn" onclick="document.getElementById('cfe-settings-window').style.visibility = 'hidden';"> &#128473; </button>
            </div>
        </div>

        <h2>Search Engine</h2>
        <form id="cfe-search-form">
          <!--<label for="cfe-search-engine">Search Engine:</label>-->
          <select name="searchEngine" id="cfe-search-engine" class="cfe-select">
            <option value="Google">Google</option>
            <option value="DuckDuckGo">DuckDuckGo</option>
            <option value="Bing">Bing</option>
            <option value="Yahoo">Yahoo!</option>
            <option value="Brave">Brave Search</option>
          </select>
          <br />
          <p>
            <input type="submit" class="cfe-submit btn" value="Save Search Engine" />
          </p>
        </form>

        <h2>Bookmarks</h2>
        <div id="cfe-form-rows"></div>
        <p>
          <button type="button" class="cfe-button btn" id="cfe-add-row-button">Add Bookmark</button>
          <button type="button" class="cfe-button btn" id="cfe-save-button">Save Bookmarks</button>
          <button type="button" class="cfe-button btnDanger" id="cfe-clear-button">Clear All</button>
          <span id="cfe-status"></span>
        </p>
        <h3>Import/Export Bookmarks</h3>
        <p>
          <button type="button" id="cfe-export-button" class="cfe-button btn"> Export CSV </button> <input type="file" value="Import CSV" id="cfe-import-file" class="cfe-button btn" accept=".csv" />
        </p>
        <p style="padding: none;">Format: "NAME,ALTNAME,URL"</p>

        <!--<textarea id="cfe-csv-output" class="cfe-textarea"></textarea>-->
        
      </div>
    </div>
      <button
      type="button"
      class="cfe-button"
      id="settingsBtn"
      onclick="document.getElementById('cfe-settings-window').style.visibility = 'visible';"
    >
      <i class="fa-solid fa-gear"></i>
    </button>
    <script src="./start.js"></script>
  </body>
</html>
